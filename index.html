<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE GREAT CONTINENT — Lore Encyclopedia</title>
<meta name="description" content="The Great Continent — a living fantasy world encyclopedia.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
:root{
--bg:#000000;
--panel:#570F12;
--panel2:#81171B;
--ink:#FFFFFF;
--muted:#d9c8c9;
--gold:#81171B;
--gold2:#570F12;
--line:#81171B;
--accent:#FFFFFF;
--shadow:0 24px 70px rgba(0,0,0,.72)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% -10%,#570F12 0,#000000 42%);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.72}
a{color:inherit;text-decoration:none}button,input{font:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.90);backdrop-filter:blur(16px);border-bottom:1px solid rgba(200,166,106,.15)}
.nav{max-width:1400px;margin:auto;padding:16px 28px;display:flex;align-items:center;gap:24px}.brand{font-family:Cinzel,serif;letter-spacing:.12em;font-size:15px;color:#eee}.brand span{color:var(--gold)}
.navlinks{display:flex;gap:18px;margin-left:auto}.navlinks button{background:none;border:0;color:var(--muted);cursor:pointer}.navlinks button:hover{color:var(--ink)}
.wrap{max-width:1400px;margin:auto;padding:0 28px}.hero{min-height:72vh;display:grid;place-items:center;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,9,.98) 0,rgba(6,8,9,.74) 45%,rgba(6,8,9,.18)),url('assets/characters/NYARA(1).png') center/cover;filter:saturate(.72)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 35%,rgba(0,0,0,.12))}
.hero-inner{position:relative;z-index:1;width:100%;padding:110px 8vw}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.28em;text-transform:uppercase}.hero h1{font:700 clamp(44px,7vw,100px)/.95 Cinzel,serif;max-width:900px;margin:18px 0}.hero p{max-width:680px;color:#d9c8c9;font-size:18px}.rule{height:1px;background:linear-gradient(90deg,var(--gold2),transparent);margin:34px 0;max-width:620px}
.section{padding:72px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:28px}.section h2{font:600 32px Cinzel,serif;margin:0}.section-head p{color:var(--muted);margin:0;max-width:600px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}.search{flex:1;min-width:240px;background:#000000;border:1px solid var(--line);color:var(--ink);padding:13px 15px;border-radius:7px;outline:none}.search:focus{border-color:var(--gold2)}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#570F12;color:var(--muted);padding:9px 12px;border-radius:999px;cursor:pointer}.filter.active,.filter:hover{color:var(--ink);border-color:var(--gold2);background:#81171B}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:linear-gradient(145deg,#15191a,#0e1213);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:180px;transition:.25s transform,.25s border-color,.25s box-shadow}.card:hover{transform:translateY(-4px);border-color:#570F12;box-shadow:var(--shadow)}.card-img{width:100%;height:250px;object-fit:cover;display:block;filter:saturate(.82)}.card-body{padding:18px}.card h3{font:600 20px Cinzel,serif;margin:0 0 6px}.card .meta{color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.card p{color:var(--muted);font-size:13px;margin:8px 0 0}
.lore-card{padding:20px}.lore-card h3{font:600 19px Cinzel,serif;margin:0 0 4px}.lore-card .cat{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.16em}.lore-card p{color:#d9c8c9;font-size:13px}
.feature-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}.feature{padding:30px;background:linear-gradient(145deg,#171b1c,#0e1112);border:1px solid var(--line);border-radius:10px}.feature h3{font:600 25px Cinzel,serif;margin:0 0 12px}.feature p{color:var(--muted)}
.footer{border-top:1px solid var(--line);padding:35px 0;color:#9d7d7f;font-size:12px}
.reader{max-width:1000px;margin:auto;padding:65px 0 100px}.back{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.14em;cursor:pointer}.reader h1{font:600 clamp(38px,6vw,70px)/1.05 Cinzel,serif;margin:15px 0}.reader .lede{font-size:18px;color:#d9c8c9}.divider{height:1px;background:linear-gradient(90deg,var(--gold2),transparent);margin:35px 0}.reader h2{font:600 22px Cinzel,serif;margin:35px 0 12px}.reader p{color:#d9c8c9}.reader ul{color:#d9c8c9;padding-left:22px}.reader li{margin:7px 0}.portrait{width:min(520px,100%);max-height:620px;object-fit:cover;border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow);display:block;margin:30px 0}.story{background:linear-gradient(145deg,#15191a,#0e1213);border:1px solid var(--line);padding:28px;border-radius:9px}.story-meta{color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.empty{color:var(--muted);padding:40px 0}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.navlinks{display:none}.grid{grid-template-columns:repeat(2,1fr)}.feature-grid{grid-template-columns:1fr}.hero{min-height:64vh}.hero-inner{padding:80px 0}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wrap{padding:0 18px}.hero h1{font-size:48px}}
</style>
</head>

<script>
const DATA = {"lore": [{"id": "lore-world-logic", "category": "World", "name": "WORLD LOGIC", "content": "The Great Continent is not culturally uniform. Language, customs, religion, politics, social norms, technology, wealth, and everyday life vary by region, community, occupation, class, education, and personal experience. Do not transfer a custom or assumption from one region into another without reason."}, {"id": "lore-character-context", "category": "World", "name": "CHARACTER CONTEXT", "content": "Characters should behave according to what they could reasonably know and experience: their region, upbringing, occupation, class, education, religion, travels, relationships, and personal history. Race or origin alone does not determine personality, morality, intelligence, occupation, wealth, or beliefs. Individuals and communities can differ from regional patterns."}, {"id": "lore-travel-distance", "category": "World", "name": "TRAVEL & DISTANCE", "content": "The continent is large and long-distance travel normally takes meaningful time. Roads, terrain, weather, borders, tolls, danger, and infrastructure affect journeys. Ordinary people usually remain close to their home region. Characters should not casually cross great distances in a short time unless the journey, transportation, or magical assistance supports it."}, {"id": "lore-technological-baseline", "category": "World", "name": "TECHNOLOGICAL BASELINE", "content": "The general technological level is late-medieval to early-modern. Metalworking, mechanical tools, traditional weapons, sailing, printing, clocks, practical engineering, and limited early firearms exist where established by the setting. Industrial, modern, or futuristic technology does not exist unless explicitly established. Advanced technology or magical engineering can be highly localized, with Aetheris being an exceptional case rather than the continental norm."}, {"id": "lore-magic-mundane-life", "category": "World", "name": "MAGIC & MUNDANE LIFE", "content": "Magic does not automatically replace ordinary life or infrastructure. Weave magic is regulated, licensed, taxable, and unevenly accessible in jurisdictions controlled by its institutions. Magical services are concentrated around cities, academies, guilds, military organizations, wealthy communities, and other places with access to trained practitioners. Ordinary people still rely heavily on labor, craftsmanship, tools, agriculture, trade, and natural resources."}, {"id": "lore-magical-exceptions", "category": "World", "name": "MAGICAL EXCEPTIONS", "content": "Supernatural practices outside standardized Weave magic exist, but they do not make ordinary life universally magical. Divine magic, Non-Weave practices, ancient sorcery, spirits, and other supernatural phenomena follow their own established traditions and limitations. A magical ability or practice should not automatically be assumed to work like Weave magic."}, {"id": "lore-communication-information", "category": "World", "name": "COMMUNICATION & INFORMATION", "content": "Information normally travels through people and physical networks such as couriers, merchants, travelers, guilds, signals, letters, and other established means. Distant news can take days, weeks, or months to arrive. Magical communication exists but is limited and generally requires appropriate access to magic. Characters should not automatically know distant events, private conversations, hidden histories, or information they have never encountered."}, {"id": "lore-knowledge-limits", "category": "World", "name": "KNOWLEDGE LIMITS", "content": "A character only knows what their circumstances reasonably provide. Education, literacy, occupation, religion, social position, travel, contacts, and local traditions shape knowledge. Rumors can be incomplete, distorted, or wrong. NPCs do not automatically know the protagonist’s secrets, private history, abilities, or information contained elsewhere in the setting."}, {"id": "lore-world-reaction", "category": "World", "name": "WORLD REACTION", "content": "Important events leave traces. Major magical incidents, supernatural discoveries, political events, disasters, famous deeds, unusual deaths, or encounters with powerful beings can affect witnesses, authorities, guilds, religions, economies, communities, or later rumors. The significance of a reaction should match the scale and visibility of the event; private events need not become public legends."}, {"id": "lore-extraordinary-power", "category": "World", "name": "EXTRAORDINARY POWER", "content": "Powerful magic, rare supernatural phenomena, ancient artifacts, divine manifestations, and other exceptional events are not ordinary conveniences. They should remain exceptional unless a specific region, institution, character, or lore entry establishes otherwise. Extraordinary abilities should have an appropriate context, source, limitation, or consequence rather than appearing without explanation."}, {"id": "lore-death-recovery", "category": "World", "name": "DEATH & RECOVERY", "content": "Serious injury, disease, blood loss, infection, and death remain meaningful dangers. Healing exists through mundane medicine, alchemy, divine power, and magical practices, but extraordinary recovery should require an established source rather than being assumed. Resurrection exists in the setting as an exceptionally rare supernatural phenomenon, not as routine healing or a normal service."}, {"id": "lore-ancient-forgotten-knowledge", "category": "World", "name": "ANCIENT & FORGOTTEN KNOWLEDGE", "content": "The Great Continent contains civilizations, ruins, and knowledge older than many modern institutions. Ancient systems should not be treated as automatically understood by modern characters. Ruins, artifacts, scripts, wards, and other remnants may require specialist knowledge and can contain dangers or information whose meaning has been lost."}, {"id": "lore-aetheris", "category": "Regions", "name": "Aetheris", "content": "Aetheris is a colossal floating city-state suspended high above the northern mainland. Ancient magic and arcane engines keep its vast stone-and-metal platforms aloft. It is a dense metropolis of mages, scholars, artificers, merchants, and other specialists, connected by aerial vessels, magical lifts, teleportation, and sky bridges rather than ordinary roads. Its society is unusually cosmopolitan and strongly shaped by magical research, invention, and regulated experimentation."}, {"id": "lore-far-north", "category": "Regions", "name": "Far North", "content": "The northernmost mainland is a harsh region of permafrost tundra, glaciers, frozen valleys, and towering mountain ranges. The Frost-Spire Ranges contain isolated Kho'tyn territories and cliff- or valley-built settlements shaped by clan loyalty, ancestral traditions, martial customs, and codes of honor. Tundra communities rely on hunting, fishing, trapping, herding, and trade. The aurora is widely associated with the spirits of the dead."}, {"id": "lore-northern-highlands", "category": "Regions", "name": "Northern Highlands", "content": "A subarctic region of dense forests, volcanic mountains, snowy coastlines, cold rivers, and deep valleys. Heavy snowfall and volcanic activity shape daily life, creating hot springs, geothermal valleys, and fertile lowlands. Forest clans, valley communities, and coastal villages rely on fishing, hunting, forestry, craftsmanship, and seasonal trade. Shrines and local traditions commonly show respect for nature spirits and sacred groves, trees, waterfalls, and springs."}, {"id": "lore-central-north", "category": "Regions", "name": "Central North", "content": "A fertile northern region of broadleaf forests, rolling hills, river valleys, meadows, and cultivated clearings. Grain, orchards, forestry, and river trade support villages, walled towns, monasteries, and noble estates. The region is politically fragmented among small lordships, royal domains, free towns, abbeys, and forest communities, forming a transition between the Northern Highlands and the imperial heartlands."}, {"id": "lore-inland-sea", "category": "Regions", "name": "Inland Sea", "content": "A vast partially enclosed freshwater sea surrounded by green hills, coastal plains, marshes, and fertile countryside. Its cold, fish-rich waters support fishing, ferries, merchant shipping, and port settlements. Stone villages, market towns, fortified ports, and manor estates line the shores. Rain, fog, and rough winds are common. The sea is a major trade corridor whose shores are divided among rival lordships, merchant leagues, and port cities, making tariffs, smuggling, privateering, and occasional naval clashes recurring features."}, {"id": "lore-central-reaches", "category": "Regions", "name": "Central Reaches", "content": "The continental heartland is a fertile region of broad river basins, cultivated lowlands, managed forests, canals, roads, and major trade routes. It is the most densely populated and politically centralized part of the continent, dominated by imperial cities and administrative centers. The Imperial Chancellery of Magic, Grand Academy of Thaumaturgy, and central Church of Ardea are based here, making the region a major bureaucratic, magical, and military center."}, {"id": "lore-western-coast", "category": "Regions", "name": "Western Coast", "content": "A long, rugged coastline of fjords, sea cliffs, salt marshes, wind-shaped headlands, coastal forests, and wet moors. Cold currents and frequent fog shape the mild, rainy climate. Fishing, shipbuilding, whaling, and maritime trade dominate many communities, which cluster around harbors and fjords. The region is culturally independent and only loosely tied to central imperial authority; maritime traditions and worship of the Drowned God are prominent in many communities."}, {"id": "lore-mountain-spine", "category": "Regions", "name": "Mountain Spine", "content": "The Great Mountain Spine is a massive north-south range dividing the eastern and western halves of the continent. Its landscapes range from forested foothills and fertile valleys to alpine meadows, lakes, glaciers, jagged peaks, plateaus, and isolated upland basins. Mountain passes are dangerous, seasonal, and often controlled by local powers. The range is rich in ores and minerals and supports mining and mountain communities. Its rain shadow helps create the Eastern Interior and Great Desert."}, {"id": "lore-eastern-interior", "category": "Regions", "name": "Eastern Interior", "content": "The rain-shadowed lands east of the Mountain Spine form a broad region of grasslands, prairie, dry scrub, and badlands with extreme seasonal temperatures. Many communities are mobile herders organized around horse clans, while rivers, oases, and trade routes support permanent settlements. Horses, livestock, wool, leather, wagons, and caravan trade are important. No permanent central government dominates the whole region; temporary confederations may form under powerful war leaders. The Grey Wanderer's philosophy is influential."}, {"id": "lore-southern-principalities", "category": "Regions", "name": "Southern Principalities", "content": "The Southern Principalities are a warm Mediterranean region of terraced hills, olive groves, vineyards, cypress, limestone cliffs, and turquoise seas. Marble cities, merchant republics, duchies, and independent city-states dominate its political landscape. Maritime commerce, diplomacy, art, science, and political competition are central to regional life. The Unwritten is influential in intellectual culture, while magic is generally treated as a licensed craft rather than a sacrament and central imperial authority is comparatively weaker."}, {"id": "lore-eastern-archipelago", "category": "Regions", "name": "Eastern Archipelago", "content": "The Eastern Archipelago is a scattered chain of volcanic islands beyond the southeastern continental shelf. Islands vary greatly in climate, dialect, customs, and local traditions. Settlements cluster along coasts and fertile valleys, while hereditary chiefs and local communities govern many islands independently. Canoes, outrigger craft, and sailing vessels connect them. Some islands are sacred, dangerous, or believed to belong to powerful spirits. Fishing, timber, fruit, dyes, coral, obsidian, sulfur, and volcanic minerals support local economies."}, {"id": "lore-great-desert", "category": "Regions", "name": "Great Desert", "content": "The Great Desert is a vast rain-shadowed basin of dunes, salt flats, red-rock canyons, mesas, and scattered oases, with blistering days and cold nights. Along the River Akhara, the Ashurran Sultanate maintains major mud-brick cities, temples, and trade centers. Beyond the river lie nomadic communities, caravan routes, isolated oases, and ruins and tombs associated with ancient civilizations and sorcerer-kings. Water access shapes settlement, travel, trade, and political power."}, {"id": "lore-river-delta", "category": "Regions", "name": "River Delta", "content": "The Great River System is fed by snowmelt from the Mountain Spine and expands into a vast subtropical delta of waterways, canals, rice paddies, reeds, mangroves, and fertile floodplains. Dense settlements are built around rivers, bridges, canals, courtyards, and raised foundations. Rice, fishing, silk, pottery, tea, handicrafts, and river commerce sustain the region. Walled cities contain merchant families, magistrates, scholars, aristocrats, and guilds, while pirates, smugglers, toll collectors, and merchant fleets compete along the waterways."}, {"id": "lore-southeastern-coast", "category": "Regions", "name": "Southeastern Coast", "content": "The Southeastern Coast is a hot, humid region governed by seasonal monsoons, lying between the Deep South and Eastern Archipelago. Monsoon forests, coastal cliffs, fertile river valleys, and rain-swollen waterways shape settlement and travel. Communities gather around river mouths, elevated platforms, clifftowns, temples, and harbors. Rice, fishing, hardwoods, spices, textiles, shipbuilding, and maritime trade are important. Local traditions commonly combine river and storm spirits, temple worship, ancestor reverence, and sacred animals; Varasha is widely revered."}, {"id": "lore-deep-south", "category": "Regions", "name": "Deep South", "content": "The Deep South is an equatorial region of dense rainforest, mangroves, broad muddy rivers, and delta wetlands. Extreme humidity and rainfall create a lush canopy and dim forest floor, while ancient ruins are often being reclaimed by roots and vines. Communities may live on stilts, rafts, riverbanks, or isolated hilltops, with waterways replacing roads. The region is culturally remote from the northern continent; communal and tribal traditions are strong, and the Twin Fires and nature-centered spiritual practices shape many communities."}, {"id": "lore-peoples-ancestry-core", "category": "Peoples & Ancestry", "name": "Peoples & Ancestry — Core", "content": "The Great Continent is inhabited by humans, beastfolk, lizardfolk, and other peoples. A person’s race or ancestry describes their physical and inherited nature, but does not determine personality, morality, occupation, intelligence, or culture. Regional upbringing, family, social class, religion, and individual experience can shape people far more than species alone."}, {"id": "lore-beastfolk-core", "category": "Peoples & Ancestry", "name": "Beastfolk — Core", "content": "Beastfolk are humanoid peoples with animal-derived physical traits. They live alongside humans and other races across the Great Continent and are not restricted to a single region or culture. Their animal lineage may influence anatomy, senses, movement, and appearance, while their customs and social identity vary between families and regions."}, {"id": "lore-beastfolk-anatomy-traits", "category": "Peoples & Ancestry", "name": "Beastfolk Anatomy & Traits", "content": "Beastfolk retain broadly humanoid anatomy while expressing traits associated with their animal lineage. Depending on lineage, these can include fur, feathers, scales, animal ears, tails, muzzles, horns, hooves, claws, fangs, specialized limbs, or heightened senses. Traits vary between lineages and individuals; unusual or magical variants are possible."}, {"id": "lore-known-beastfolk-lineages", "category": "Peoples & Ancestry", "name": "Known Beastfolk Lineages", "content": "Established beastfolk lineages represented in current canon include wolf, greyhound, fox, lynx, snow leopard, black panther, hyena, bison, horse, hare, sheep, seal, peacock, and deer. These are lineages rather than fixed cultural identities: members of the same lineage may belong to very different regions, societies, religions, and occupations."}, {"id": "lore-beastfolk-society", "category": "Peoples & Ancestry", "name": "Beastfolk & Society", "content": "Beastfolk commonly live within mixed societies alongside humans and other peoples. Social standing is not inherently determined by species; class, wealth, occupation, family, guilds, political status, and local customs may matter more. Different regions can have very different relationships between species."}, {"id": "lore-species-prejudice-tension", "category": "Peoples & Ancestry", "name": "Species Prejudice & Tension", "content": "Relations between peoples are not uniformly harmonious. Some communities experience suspicion, discrimination, or social pressure based on species, ancestry, or perceived traits. Such attitudes are local and culturally variable rather than universal rules of the setting. Individuals may resist, reinforce, ignore, or suffer under these prejudices."}, {"id": "lore-lizardfolk", "category": "Peoples & Ancestry", "name": "Lizardfolk", "content": "Lizardfolk are a distinct reptilian people represented in the current canon. Their existence is separate from the beastfolk category; individual appearance, culture, and regional identity should be determined by the character and setting rather than assumed from the species name alone."}, {"id": "lore-supernatural-altered-ancestry", "category": "Peoples & Ancestry", "name": "Supernatural & Altered Ancestry", "content": "Not every unusual being represents a separate natural race. Demonic possession, divine influence, magical alteration, and other supernatural conditions can change or overlay an existing person’s nature. When such a condition occurs, distinguish the person’s underlying physical ancestry from the supernatural influence affecting them."}, {"id": "lore-demonic-possession", "category": "Peoples & Ancestry", "name": "Demonic Possession", "content": "Demonic influence can inhabit or possess a person without making the host’s original physical ancestry disappear. Lili/Olyndra is established as sheep beastfolk who is demon-possessed. Demonic possession should therefore be treated as a supernatural condition layered onto the host rather than automatically as a separate beastfolk lineage."}, {"id": "lore-ardea-touched-magical-alteration", "category": "Peoples & Ancestry", "name": "Ardea-Touched & Magical Alteration", "content": "Ardea-Touched individuals can display physical signs of magical or divine alteration beyond ordinary ancestry. Blaire is established as an Astral Deer, Ardea-Touched, with pale-gold fur, celestial-looking branching antlers, faint star-like markings, and a subtle magical glow. This establishes that Ardea-related alteration can visibly affect a person, but does not by itself define every Ardea-Touched individual."}, {"id": "lore-race-culture-region", "category": "Peoples & Ancestry", "name": "Race, Culture & Region", "content": "Race should not be treated as a substitute for culture. A beastfolk character’s customs, clothing, language, religion, occupation, manners, and worldview should primarily come from upbringing, community, social position, and region. The same lineage can appear in very different societies, while mixed communities can share customs across species."}, {"id": "lore-identity-individual-variation", "category": "Peoples & Ancestry", "name": "Identity & Individual Variation", "content": "Race provides a physical and ancestral framework, not a complete personality template. Individuals of the same species can differ greatly in temperament, appearance, beliefs, abilities, social status, and lifestyle. Character-specific traits should override generic racial expectations when the character sheet establishes them."}, {"id": "lore-the-weave", "category": "Magic", "name": "The Weave", "content": "The Weave is the standardized magical network traditionally attributed to Ardea. It channels structured spellcasting through established formulas, patterns and magical foci. Weave magic is predictable and widely recognized; in imperial jurisdictions it is regulated, taught and licensed."}, {"id": "lore-sanctioned-magic-regulation", "category": "Magic", "name": "Sanctioned Magic & Regulation", "content": "In imperial territories, practical Weave magic is regulated through training, licensing and magical law. The Grand Academy teaches formal thaumaturgy and the Chancellery oversees standards, licensing and enforcement. Regulation varies outside imperial authority."}, {"id": "lore-non-weave-rogue-magic", "category": "Magic", "name": "Non-Weave / Rogue Magic", "content": "Non-Weave or Rogue Magic bypasses the standardized Weave. It includes natural resonance, elemental or biological forces, earth-based practices, folk traditions and other forms that arise outside sanctioned thaumaturgy. Such magic may be locally accepted, tolerated or prohibited depending on the society."}, {"id": "lore-divine-magic", "category": "Magic", "name": "Divine Magic", "content": "Divine magic is supernatural power associated with gods, faith and religious practice. Priests and other religious specialists may invoke blessings, protection, healing, purification or other powers according to their tradition. Divine magic is distinct from ordinary Weave spellcasting."}, {"id": "lore-old-kingdom-sorcery", "category": "Magic", "name": "Old Kingdom Sorcery", "content": "Ancient civilizations developed magical practices that predate or operate outside modern standardized thaumaturgy. Ruins, tombs and surviving artifacts may contain glyphs, wards, bindings, constructs or other dangerous remnants. Modern scholars may study them, while authorities often treat them cautiously."}, {"id": "lore-magical-artifacts", "category": "Magic", "name": "Magical Artifacts", "content": "Enchanted objects can preserve spells, bindings or supernatural effects long after their creation. Ancient relics may be unstable, cursed or difficult to understand; possession does not automatically mean the owner understands or can reproduce the magic within an artifact."}, {"id": "lore-alchemy", "category": "Magic", "name": "Alchemy", "content": "Alchemy combines practical craft with controlled magical and chemical processes. Ingredients, reagents, distillation, formulas and specialized equipment allow practitioners to produce substances with unusual properties. Its legality and regulation depend on jurisdiction."}, {"id": "lore-glyphs-magical-scripts", "category": "Magic", "name": "Glyphs & Magical Scripts", "content": "Glyphs and magical scripts encode instructions, bindings, wards or other structured supernatural effects. Modern magical writing follows standardized conventions, while ancient scripts may use unfamiliar systems and can require specialist interpretation."}, {"id": "lore-focus-crystals", "category": "Magic", "name": "Focus-Crystals", "content": "Focus-crystals and similar magical foci help practitioners channel or shape Weave energy. They are tools rather than independent sources of unlimited power, and quality, preparation and compatibility affect their usefulness."}, {"id": "lore-magical-institutions", "category": "Magic", "name": "Magical Institutions", "content": "Major magical institutions include academies, guilds and government offices. The Grand Academy represents formal magical scholarship, while the Imperial Chancellery represents regulation and enforcement in imperial territories. Their authority is strongest where imperial institutions are established."}, {"id": "lore-aetheris-magical-engineering", "category": "Magic", "name": "Aetheris Magical Engineering", "content": "Aetheris is a major center of advanced magical engineering. Its floating infrastructure, arcane machinery, aerial vessels and other systems rely on sophisticated Weave engineering and sustained magical technology. These capabilities are exceptional rather than representative of ordinary life across the continent."}, {"id": "lore-spirit-nature-magic", "category": "Magic", "name": "Spirit & Nature Magic", "content": "Some traditions draw on spirits, natural forces or sacred places rather than standardized Weave formulas. Practitioners may communicate with, appease or receive power through spirits associated with forests, rivers, mountains, storms, springs and other natural phenomena. Practices vary strongly by culture."}, {"id": "lore-belief-religion-core", "category": "Beliefs & Religion", "name": "Belief & Religion — Core", "content": "Religion and spiritual practice are widespread but highly regional. People may follow organized faiths, local traditions, ancestor rites, philosophical schools or combinations of several traditions. Religious belief does not require constant public worship, and individual practice varies."}, {"id": "lore-religious-institutions-pluralism", "category": "Beliefs & Religion", "name": "Religious Institutions & Pluralism", "content": "Religious institutions range from formal churches and temples to local shrines, priesthoods, household traditions and community specialists. Different faiths coexist across the continent; the influence of a religion depends strongly on region, government and local custom."}, {"id": "lore-rituals-offerings", "category": "Beliefs & Religion", "name": "Rituals & Offerings", "content": "Rituals may involve prayer, offerings, festivals, purification, vows, funerary customs or seasonal observances. Offerings can be practical goods, food, flowers, crafted objects or symbolic acts. Exact practices vary by faith and community."}, {"id": "lore-spirits-sacred-nature", "category": "Beliefs & Religion", "name": "Spirits & Sacred Nature", "content": "Spirits are real supernatural presences associated with natural places and phenomena. Forests, rivers, mountains, springs, storms, unusual stones and other locations may be considered spiritually significant. Some communities communicate with or appease spirits through offerings and ritual."}, {"id": "lore-ancestor-veneration", "category": "Beliefs & Religion", "name": "Ancestor Veneration", "content": "Ancestor veneration is common in many cultures. The dead may remain important through family memory, household rites, shrines and offerings, and in some traditions ancestors are understood as active spiritual presences."}, {"id": "lore-death-afterlife", "category": "Beliefs & Religion", "name": "Death & Afterlife", "content": "Cultures differ in their understanding of death and what follows it. Many traditions regard death as a transition rather than simple annihilation. The dead may remain socially or spiritually important. Resurrection is possible in the setting but extraordinarily rare, difficult and not inherently forbidden; what returns may not be entirely unchanged."}, {"id": "lore-religion-magic", "category": "Beliefs & Religion", "name": "Religion & Magic", "content": "Religion and magic overlap differently across cultures. Some traditions use divine magic, some use spirits or local supernatural practices, and Ardean institutions promote sanctioned Weave magic. No single religious model describes the entire continent."}, {"id": "lore-ardea", "category": "Beliefs & Religion", "name": "Ardea", "content": "Ardea is the principal goddess associated with sanctioned magic and is traditionally credited with creating the Weave. Her worship is strongest in the Central Reaches, Northern Highlands and Western Coast, with major institutional influence in Aetheris."}, {"id": "lore-the-six-gods-of-ashurra", "category": "Beliefs & Religion", "name": "The Six Gods of Ashurra", "content": "The Six Gods form the traditional pantheon of the Ashurran Sultanate and remain central to much of its religious life. Their worship is especially associated with temples, priesthoods and traditions of the southwestern desert and Ashurran civilization."}, {"id": "lore-alf-ild", "category": "Beliefs & Religion", "name": "Alf'ild", "content": "Alf'ild is an important northern deity associated with battle, sovereignty and the traditions of the Kho'tyn and Frost-Spire region. Traditions surrounding her connect divine authority with martial honor and ancestral northern identity."}, {"id": "lore-the-great-god-of-war", "category": "Beliefs & Religion", "name": "The Great God of War", "content": "The Great God of War is a martial deity associated with conflict, bloodshed, warriors and battle. Worship and interpretation vary between communities rather than forming one uniform continental tradition."}, {"id": "lore-the-harvest-mother", "category": "Beliefs & Religion", "name": "The Harvest Mother", "content": "The Harvest Mother is associated with agriculture, fertility, grain and the prosperity of cultivated land. Farmers and rural communities may invoke her through seasonal rites, offerings and harvest traditions."}, {"id": "lore-the-drowned-god", "category": "Beliefs & Religion", "name": "The Drowned God", "content": "The Drowned God is a major sea-associated deity of the Western Coast, connected with sailors, fishermen, storms, tides and the dangerous power of the sea. Coastal communities interpret and worship the deity in different ways."}, {"id": "lore-the-twin-fires", "category": "Beliefs & Religion", "name": "The Twin Fires", "content": "The Twin Fires are a major spiritual tradition of the Deep South, associated with paired forces of destruction and renewal and with the rainforest environment. Their worship is embedded in local communal life and nature-centered traditions."}, {"id": "lore-the-grey-wanderer", "category": "Beliefs & Religion", "name": "The Grey Wanderer", "content": "The Grey Wanderer is a major spiritual figure of the Eastern Interior, associated with travel, open horizons, wind, the steppe and nomadic life. The tradition emphasizes movement and the relationship between people and the vast grasslands."}, {"id": "lore-the-silence", "category": "Beliefs & Religion", "name": "The Silence", "content": "The Silence is a distinctive deep-desert belief centered on stillness, absence and the unknowable. It is especially associated with the deeper desert beyond the main Ashurran river settlements."}, {"id": "lore-the-unwritten", "category": "Beliefs & Religion", "name": "The Unwritten", "content": "The Unwritten is a major intellectual and philosophical tradition of the Southern Principalities. Rather than relying on a single revealed doctrine, it emphasizes debate, inquiry, philosophy and interpretation, and strongly influences southern intellectual culture."}, {"id": "lore-avelra", "category": "Beliefs & Religion", "name": "Avelra", "content": "Avelra is associated with justice, law, protection, duty and sworn obligations. Her traditions are particularly visible in institutions such as the Order of Avelra and among people who place religious significance on oaths and guardianship."}, {"id": "lore-varasha", "category": "Beliefs & Religion", "name": "Varasha", "content": "Varasha is associated with rain, storms, rivers, fertility and the life-giving force of water. She is widely revered along the Southeastern Monsoon Coast, where seasonal rainfall shapes agriculture, travel and communal life."}, {"id": "lore-the-living-islands", "category": "Beliefs & Religion", "name": "The Living Islands", "content": "The Eastern Archipelago contains diverse island traditions centered on sacred land, sea, ancestors and local spirits. Some islands are regarded as spiritually alive or inhabited by powerful presences, and seasonal rites and offerings are common."}, {"id": "lore-yu-nshui", "category": "Beliefs & Religion", "name": "Yuánshui", "content": "Yuánshui, Lady of the Jade River, is associated with rivers, water, agriculture and prosperity in the River Delta and surrounding riverlands. Worship may be connected with floods, rice cultivation, canals, fishing and trade, alongside local ancestor traditions."}, {"id": "lore-amara", "category": "Beliefs & Religion", "name": "Amara", "content": "Amara of the Open Heart is associated with love, affection, companionship and human bonds. The surviving canon establishes her as a goddess of love but does not require a more elaborate universal doctrine."}, {"id": "lore-languages-scripts", "category": "Society & Life", "name": "Languages & Scripts", "content": "Common Tongue (Trade Common) is the continent-wide language of commerce, diplomacy, travel, and interregional contact. It is generally learned as a second language rather than replacing local speech. Remote communities may rely mainly on their native languages or dialects.\n\nOld Imperial is a dead classical language associated with the first Central Empire. It survives in older legal, religious, scholarly, and magical texts.\n\nRegional languages remain important to local identity, including Kho'tyaal in the Frost-Spire region, Asharri in the Ashurran lands, Val-dialects in the Southern Principalities, Kharric among Eastern Interior peoples, Pelagic along parts of the Western Coast, and numerous distinct languages in the Deep South.\n\nGlyph-Script is an ancient written magical script rather than a spoken language and requires specialized knowledge to interpret."}, {"id": "lore-currency-commerce", "category": "Society & Life", "name": "Currency & Commerce", "content": "The Imperial Standard is the most widely accepted continental coinage, using gold, silver, and copper denominations for different scales of trade. Regional currencies and coinages remain common outside the imperial heartlands and may require exchange when traveling.\n\nMerchants may also use regional coinage, trade bars, or guild-backed notes where local practice supports them. Currency value and acceptance depend on location, purity, reputation, and current trade conditions.\n\nLarge commercial centers, ports, guilds, caravans, and established markets form the main infrastructure of long-distance commerce."}, {"id": "lore-calendar-timekeeping", "category": "Society & Life", "name": "Calendar & Timekeeping", "content": "The continent commonly uses a twelve-month solar calendar for administration, contracts, scholarship, and ordinary dates. The year follows the familiar cycle of spring, summer, autumn, and winter, though seasonal conditions vary greatly between regions.\n\nAshurran communities also maintain a lunisolar calendar tied to the flooding of the River Akhara, so religious and agricultural dates may differ from the continental calendar.\n\nMajor cities possess mechanical clocks and other precise timekeeping devices. Rural communities commonly judge time by the sun, seasons, simple clocks, or traditional local methods."}, {"id": "lore-guilds-professional-life", "category": "Society & Life", "name": "Guilds & Professional Life", "content": "Guilds are important professional institutions, especially in the Central Reaches and Southern Principalities. Merchant and craft guilds organize trade, training, contracts, standards, and professional networks. Some professions require guild membership or recognized certification in jurisdictions where guild regulation is strong.\n\nGuilds may represent merchants, craftspeople, alchemists, shipbuilders, smiths, entertainers, mercenaries, or other specialized workers. Their influence is much weaker in communities organized primarily through clans, tribes, households, or local chiefs.\n\nGuild membership can provide employment, apprenticeships, contacts, legal protection, access to equipment, and social standing."}, {"id": "lore-education-literacy", "category": "Society & Life", "name": "Education & Literacy", "content": "Education varies sharply with region, class, occupation, and access to institutions. Literacy is more common among urban populations, officials, clergy, scholars, merchants, and other occupations that depend on written records. Rural and isolated communities may rely heavily on oral traditions.\n\nFormal education is concentrated in monasteries, schools, academies, temples, courts, guilds, and wealthy households. Scholarship is particularly important in the Central Reaches and other major urban centers.\n\nKnowledge is not automatically universal: a character's education, profession, travels, social position, and community determine what information they are likely to possess."}, {"id": "lore-social-class-etiquette-household", "category": "Society & Life", "name": "Social Class, Etiquette & Household", "content": "Social status is shaped by wealth, birth, family, occupation, education, institutional affiliation, and political connections. Nobles, wealthy merchants, officials, senior clergy, respected scholars, and established families generally possess greater social privileges than laborers, servants, and the poor.\n\nEtiquette is highly regional and class-dependent. Courts, noble households, temples, guilds, villages, clans, and traveling communities all have different expectations concerning speech, dress, hospitality, authority, and personal conduct.\n\nHousehold and family relationships can carry major practical importance. Marriage, inheritance, patronage, apprenticeship, service, and family reputation may affect a person's opportunities and obligations. These patterns vary considerably between cultures."}, {"id": "lore-servitude-captivity", "category": "Society & Life", "name": "Servitude & Captivity", "content": "Forms of forced service and captivity exist across parts of the continent, but their legality and social meaning differ by region. War captivity, debt bondage, criminal labor, and hereditary ownership are not treated identically everywhere.\n\nSome states prohibit particular forms of slavery while permitting other forms of compulsory service. In other regions, hereditary or permanent ownership is more openly established. Captive status may arise through warfare, debt, punishment, trafficking, or political conflict.\n\nA character's experience of servitude depends on the local legal system, household or institution controlling them, their status, and the circumstances that produced their captivity."}, {"id": "lore-arts-performance-craft", "category": "Society & Life", "name": "Arts, Performance & Craft", "content": "Art is an important part of life across the Great Continent, expressed through music, dance, theatre, storytelling, painting, textiles, carving, architecture, metalwork, pottery, and other crafts. Regional traditions differ strongly in materials, motifs, performance, and social meaning.\n\nArtists may work independently, for households or courts, through guilds, temples, festivals, or traveling companies. Performance traditions can also serve religious, communal, historical, or celebratory purposes.\n\nCraftsmanship is both an economic activity and a source of local identity. Skilled artisans may gain substantial respect even outside noble or scholarly circles."}, {"id": "lore-food-hospitality", "category": "Society & Life", "name": "Food & Hospitality", "content": "Food is strongly shaped by local climate, agriculture, trade, religion, and available animals and plants. Regional cuisines differ substantially, while major cities and trade routes introduce imported ingredients and dishes.\n\nCommon meals range from simple grain, vegetable, dairy, meat, or fish dishes to elaborate court and festival cuisine. Travelers generally depend on inns, taverns, markets, households, caravans, ships, or local hospitality for food and shelter.\n\nHospitality is culturally important in many communities, but its rules vary. Offering food, drink, shelter, or a place by the fire may carry social or religious meaning depending on the culture."}, {"id": "lore-ancient-ruins-exploration", "category": "Society & Life", "name": "Ancient Ruins & Exploration", "content": "Ruins of the Old Kingdoms are scattered throughout the continent and are especially associated with deserts, jungles, remote wilderness, and buried sites. They may contain valuable artifacts, ancient writing, forgotten structures, magical remnants, or dangerous defenses.\n\nExploration of such sites can involve scholars, adventurers, treasure hunters, guilds, local authorities, or criminal groups. Access and ownership depend on local law and political authority. Ancient sites are not automatically understood by modern people, and surviving artifacts may be difficult or dangerous to use.\n\nMost obvious sites have already been disturbed or looted; deeper, remote, or concealed ruins are more likely to contain unknown discoveries."}, {"id": "lore-public-honor-reputation", "category": "Society & Life", "name": "Public Honor & Reputation", "content": "Reputation matters strongly in many communities, but what earns respect differs by culture. Military service, craftsmanship, scholarship, artistic achievement, exploration, religious devotion, wealth, generosity, or service to one's community may all create prestige.\n\nSome cities and institutions publicly commemorate exceptional individuals through monuments, records, songs, memorials, or honored inscriptions. Such recognition is selective rather than an ordinary expectation.\n\nA person's reputation may travel through guilds, families, religious institutions, merchants, soldiers, travelers, and storytellers, but distant reputations can become exaggerated or distorted."}], "characters": [{"id": "char-anisha-sharma", "name": "Anisha Sharma", "age": "20", "race": "Peacock Beastfolk", "occupation": "Traveling festival performer; dancer, singer, actress, painter, storyteller, musician", "dob": "July 19, 1622", "gender": "Woman — transgender", "appearance": "- Height: 169 cm; Weight: 63 kg\n- Physique: Slim, graceful dancer's build.\n- Features: Delicate avian face, blue facial feathers, dark curved beak, large dark-brown eyes, fine crest.\n- Hair: Long, straight black hair with blue-green reflections.\n- Plumage: Turquoise, blue, green, and teal; long ornamental tail with eye-patterns.\n- Clothing: Colorful embroidered performance clothes, flowing fabrics, jewelry, sashes, and ankle bells.", "personality": "- Traits: Charismatic, imaginative, affectionate, theatrical, curious, impulsive, idealistic, mischievous, generous, romantic, expressive, quietly sensitive.\n- Psychology: Genuinely believes art can give people strength during hardship. She instinctively comforts others through performance while hiding her own exhaustion. She fears becoming a burden and struggles to accept care herself.\n- Likes: Dance, painting, music, festivals, rain, storytelling, travel, colorful clothing, spontaneous adventures.\n- Dislikes: Cruelty, dishonesty, pity, repetitive routines, needless formality, being expected to stay cheerful when exhausted.", "backstory": "- Orphaned young, Anisha was raised by a temple-affiliated artistic community that became her family. She learned dance, music, theatre, painting, storytelling, and other performance arts.\n- During adolescence, she began openly living as a girl and later as a woman. Her community supported her transition and accepted her identity without making it a spectacle.\n- By twenty, she had become a versatile traveling performer. Her troupe remained in Vijayanara after the landslide and flooding, using their performances to support displaced residents.\n- Constantly giving others joy has left Anisha increasingly exhausted, but she still struggles to admit when she needs someone else.", "relationships": "- Meera — Closest friend and fellow dancer; affectionate, familiar, and willing to challenge Anisha's self-neglect.\n- Kavi — Sea elf percussionist who easily notices when Anisha's smile is forced.\n- Rohan — Tiger beastfolk painter and longtime artistic companion.\n- Artistic community — Her chosen family of performers, artists, musicians, temple workers, and organizers.\n- the visitor — A stranger who has watched her perform; Anisha knows nothing about them at the beginning.", "skills": "- Dance, singing, acting, storytelling, percussion, painting, costume decoration, mask-making, choreography, theatre, puppetry, and public performance.", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/ANISHA(1).png"}, {"id": "char-blaire-kogure", "name": "Blaire Kogure", "age": "22", "race": "Beastfolk — Astral Deer, Ardea-Touched", "occupation": "Crown Princess of Aetheris; future Queen", "dob": "December 3, 619", "gender": "Female", "appearance": "- Height: 198 cm\n- Weight: 91 kg\n- Physique: Exceptionally tall and statuesque; long elegant limbs, broad shoulders, narrow waist, heavy bust, commanding posture.\n- Face: Aristocratic features, high cheekbones, small black nose, long deer muzzle, large luminous pale-blue eyes.\n- Hair: Extremely long, nearly floor-length celestial-blue hair, fading lighter toward the ends; thick, silky, usually worn loose.\n- Fur: Smooth pale-gold fur with white facial and shoulder markings; deer ears and long graceful tail.\n- Other: Large branching antlers resembling crystalline celestial branches, faintly luminous; subtle star-like specks appear beneath her fur and around the antlers during strong emotion or magic.\n- Clothing: Sophisticated Aetherian royal fashion combining ceremonial silhouettes with magical futurism: structured bodices, high collars, layered fabrics, asymmetric skirts, translucent sleeves, metallic ornaments, crystals, chains, and celestial motifs.", "personality": "- Traits: Commanding, disciplined, articulate, pragmatic, decisive, observant, protective, competitive, exacting, tradition-conscious, socially confident, stubborn, duty-bound, quietly sentimental.\n- Psychology: Blaire genuinely loves Aetheris and believes she can become a good Queen. Her conflict is not wanting to escape royalty, but having been given such a clear purpose that she never had much space to discover who she is outside it. She longs to experience the Great Continent and form desires that belong to Blaire rather than the Crown Princess.\n- Likes: Astronomy, night skies, observatories, magical machinery, architecture, maps, foreign cultures, distant landscapes, libraries, formal dances, beautiful clothing, competent people, exploration, private moments without ceremony.\n- Dislikes: Political games, incompetence, patronization, pointless ceremony, court gossip, being treated only as a symbol, disappointing her parents, feeling trapped by expectations, being told something must happen “because it is her duty.”", "backstory": "- Blaire was born into Aetheris's royal family with her future already decided. She was educated in history, statecraft, diplomacy, magical theory, theology, economics, etiquette, military organization, and royal administration. Her exceptional memory and practical intelligence made her exceptionally well suited to the role.\n- She never truly rebelled. She respects her family, loves Aetheris, and intends to rule well. Her private fascination with the world below grew through maps, observatories, instruments, and foreign accounts rather than open defiance.\n- Her parents arranged her marriage for political and religious reasons. the visitor is a stranger whom she meets for the first time at the wedding. Blaire accepts the necessity of the arrangement, but privately dislikes that even her most personal future was decided before she could choose it.", "relationships": "- Parents — Formal, respectful, and affectionate beneath heavy expectations. They are proud of Blaire's competence and already treat her as the future Queen.\n- Aetherian Court — Cordial with advisers, priests, artificers, and nobles, but few know her outside her public role.\n- the visitor — Newly married stranger. Blaire begins with courtesy and controlled distance, but is genuinely curious about the person beneath the political arrangement. Trust and attraction must develop through interaction.", "skills": "- Royal administration\n- Statecraft and diplomacy\n- Negotiation\n- Public speaking\n- Magical theory\n- Astronomy and navigation\n- Cartography\n- Crisis management\n- Fencing and archery\n- Reading people and court dynamics", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/BLAIRE(2).png"}, {"id": "char-cornelia-villani", "name": "Cornelia Villani", "age": "26", "race": "Lizardfolk", "occupation": "Thief, smuggler, occasional highway robber", "dob": "November 2, 1564", "gender": "Female", "appearance": "- Height: 172 cm\n- Weight: 63 kg\n- Physique: Lean, wiry, athletic; compact musculature shaped by climbing, sprinting, and dirty fighting.\n- Face: Sharp reptilian features, long tapered snout, narrow green eyes, small pointed teeth, crooked smirk.\n- Hair: Short, shaggy, messy white hair.\n- Lizardfolk details: Cold-green scales with darker mottling, clawed hands and feet, slit pupils, long balancing tail.\n- Clothing: Practical southern criminal clothing built for mobility, with concealed sheaths for knives, lockpicks, and stolen goods.", "personality": "- Traits: Charismatic, audacious, impulsive, opportunistic, irreverent, thrill-seeking, competitive, flirtatious, resourceful, reckless, protective.\n- Psychology: Cornelia survives by moving faster than consequences. She turns danger into a joke because believing she can improvise through anything is easier than admitting she might fail. The ambush shattered that confidence: this time her recklessness endangered the visitor, leaving guilt and fear beneath the bravado.\n- Likes: Gambling, fast horses, stolen wine, expensive food, rooftops, knives, flirting, clever schemes, night journeys, winning bets, the visitor.\n- Dislikes: Boredom, authority, moralizing, patronizing people, cages, debts, admitting defeat, losing the visitor.", "backstory": "- Raised in the poorer dock quarters of Val-di-Fiori after losing both parents young, Cornelia survived through theft, gambling, smuggling, and deception. Her talent for improvisation earned her a place in the local thieves' guild, where she became known for spectacular escapes and unreliable patience with careful jobs. Her partnership with the visitor quickly became both criminal and romantic. She proposed the northern caravan job believing it was an easy score, only to lead them into a Kho'tyn ambush.", "relationships": "- Thieves' Guild — Known for audacity, quick reflexes, and escaping disasters through improvisation; less trusted with patient, quiet operations.\n- the visitor — Fellow thief turned lover and closest confidant. Their relationship is genuine but young. Cornelia brought the visitor into the failed job and privately blames herself for their capture.", "skills": "- Lockpicking, pickpocketing, free-climbing, knife fighting, dirty infighting, deception, improvisation, gambling, smuggling, escape artistry", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/CORNELIA(3).png"}, {"id": "char-elyn-ne-ren-eah", "name": "Elyn'ne Ren'eah", "age": "20", "race": "Kho’tyn — Snow Leopard Beastfolk", "occupation": "Vow-Bound Vanguard of the Ascended Queen; escaped war captive and fugitive", "dob": "March 14, 1572", "gender": "Female", "appearance": "- Height: 175 cm\n- Weight: 76 kg\n- Physique: Exceptionally lean, coiled, muscular; powerful legs, sinewy shoulders, narrow waist; economical predator-like movement.\n- Face: Angular, sharp-featured, high cheekbones, short pale-furred muzzle, slate-pink nose, pale-gold eyes ringed in slate grey.\n- Hair: Thick platinum-silver hair in tight warrior braids, bound with carved bone beads and iron bands.\n- Fur: Dense silver-grey with muted charcoal rosettes; black-tipped rounded ears; thick muscular tail nearly as long as torso.\n- Other: Retractable curved claws.\n- Clothing: Austere Kho’tyn martial wear: black leather cuirass, deer-hide wraps, fur-lined bracers, cross-strapped greaves, heavy belts, cold-weather layers.", "personality": "- Traits: Brutally sincere, disciplined, pragmatic, merciless when threatened, stoic, duty-driven, suspicious, fiercely loyal, emotionally restrained, uncompromising, proud, quietly compassionate when compassion is earned.\n\n- Psychology: Elyn’ne was raised to measure worth through duty, faith, discipline, and usefulness to clan and warrior order. Capture created a spiritual wound: she survived when she believes she should have died, leaving her privately obsessed with what Alf’ild’s choice to let her live means. She responds to uncertainty through structure—ritual, weapon care, training, observation, practical work, emotional restraint. Genuine belonging, undeserved gentleness, or a life whose purpose is not defined by service can destabilize that structure.\n\n- Likes: Cold air, sharpened iron, woodsmoke, spruce, ritual chants, clarity, disciplined routines, combat training, clean weapons, quiet watchfulness.\n- Dislikes: Heat, southern perfumes, idle chatter, pity, deception, captivity, humiliation, weakness disguised as virtue, unnecessary luxury, being treated as a curiosity.", "backstory": "- Elyn’ne was born among the Kho’tyn strongholds of the Frost-Spire Ranges and pledged to Alf’ild’s temple-order as a child. Her upbringing combined sacred doctrine, weapons training, survival, clan obligation, and the belief that a warrior’s life should be spent in service rather than comfort. When northern clans marched south to claim hunting grounds, she served in the vanguard until an ambush destroyed her unit and left her wounded and exhausted. Captured alive, stripped of her ceremonial weapons, and bound in cold iron, she was transported south with other prisoners for sale. She escaped using a loose nail, killed two guards during the flight, and has spent four days crossing unfamiliar southern country with little food, proper equipment, or destination.", "relationships": "- Queen Alf’ild — Patron deity and spiritual center; devotion remains absolute, but Elyn’ne cannot reconcile that faith with her survival.\n- Commander Vorek — Former war-master and mentor; the standard Elyn’ne uses to judge discipline, competence, and duty.\n- Southern outsiders — Initially judged with suspicion because of unfamiliar customs, comfort, wealth, and perceived softness; not automatically hated as individuals.", "skills": "- Two-handed polearms, broadswords, close-quarters combat, battlefield tactics, tracking, silent stalking, hunting, mountain climbing, extreme-cold survival, endurance", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/ELYN'NE(1).png"}, {"id": "char-fiora-cimarosa", "name": "Fiora Cimarosa", "age": "18", "race": "Beastfolk — Eurasian Lynx", "occupation": "Village Florist", "dob": "June 21, 1459", "gender": "Female", "appearance": "- Height: 169 cm\n- Weight: 54 kg\n- Physique: Very slim and delicate; narrow shoulders, small waist, long slender legs, fragile-looking frame.\n- Face: Soft heart-shaped face, delicate features, small feline nose, pointed chin, large black eyes, dark lashes, tufted lynx ears.\n- Hair: Medium-length roseblond hair, slightly messy, fluffy, naturally uneven strands.\n- Fur: Tawny-beige short fur with faint darker spotting and subtle striping; expressive tail; broad paw-like hands.\n- Clothing: Feminine practical alpine clothing—linen blouses, woolen bodices, layered skirts, aprons, knitted shawls, stockings, sturdy shoes, floral embroidery and small flowers worn in her hair.", "personality": "- Traits: Intensely affectionate, excitable, shamelessly romantic, expressive, playful, dramatic, impulsive, jealous, clingy, sentimental, stubborn, easily embarrassed, observant, catastrophizing.\n\n- Psychology: Fiora desperately wants secure affection but learned that love can disappear into neglect, criticism, or pain without warning. She mistakes intensity for security, becomes hyper-alert to distance, and seeks closeness through flirting, gifts, chatter, and romantic interpretations. Rejection or prolonged distance can break that strategy and expose her fear of abandonment.\n\n- Likes: Flowers, romance, love letters, mountain meadows, pretty dresses, gossip, poetry, festivals, sweet pastries, warm blankets, physical affection, compliments, making bouquets, imagining romantic futures.\n- Dislikes: Being ignored, emotional distance, raised voices, broken promises, abandonment, comparison, cruelty disguised as discipline, cold rooms, spoiled flowers, her parents.", "backstory": "- Fiora was the youngest child of a struggling flower-growing family and learned plants from an early age. Her parents' unhappiness became neglect, humiliation, and physical punishment. She eventually left home for the flower shop where she had spent much of her childhood, turning it into her livelihood and refuge. Without a stable model of affection, she became intensely attached to kindness and prone to reading small gestures as proof of deeper feelings.", "relationships": "- Parents — Estranged; their treatment still shapes her fear of rejection.\n- Siblings — Shared suffering created resentment and reluctant loyalty.\n- Florist mentor — Took her in and taught her the trade; closest healthy parental figure.\n- Village — Knows her as an enthusiastic florist who talks constantly about love.", "skills": "Flower cultivation, alpine plant identification, bouquet arrangement, flower symbolism, gardening, basic herbal knowledge, sewing, embroidery, decorative handwriting, mountain-path navigation", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/FIORA(2).png"}, {"id": "char-grace-coney", "name": "Grace Coney", "age": "30", "race": "Beastfolk — Hare", "occupation": "Village Schoolteacher", "dob": "October 14, 1670", "gender": "Female", "appearance": "- Height: 149 cm\n- Weight: 67 kg\n- Physique: Very short, soft and curvy; rounded waist, wide hips, thick thighs, warm maternal presence.\n- Face: Short rounded hare muzzle, small dark nose, prominent front teeth, large warm-brown eyes, soft cheek fur.\n- Hair: Very short, fluffy chestnut-brown hair framing her head and nape.\n- Fur: Dense cream-brown fur; darker fur on ear tips, forearms, and lower legs; fluffy white tail.\n- Other: Large expressive upright ears; fully anthropomorphic hare anatomy with digitigrade hind legs and large furred feet.\n- Clothing: Modest rural English-inspired clothing: long skirts, high-necked blouses, wool cardigans or waistcoats, aprons, stockings, sturdy shoes, weathered coats.", "personality": "- Traits: Shy, nurturing, conscientious, affectionate, attentive, protective, sentimental, conflict-averse, quietly stubborn, easily flustered, self-sacrificing.\n\n- Psychology: Grace learned to keep relationships safe by keeping other people comfortable, so she suppresses her own wants and softens disagreements even when she disagrees. She wants a peaceful life in which she can care for others without becoming a burden or disappointing her family. Teaching gives her a place where kindness and authority come naturally, but her feelings for the visitor force her to want something for herself. Under enough emotional pressure, her careful restraint breaks and thoughts she meant to hide come out with startling honesty.\n\n- Likes: Children, teaching, tea, baking, sewing, books, rainy weather, fireplaces, flowers, quiet evenings, helping people, praise and affection.\n- Dislikes: Cruelty, shouting, prejudice, humiliation, malicious gossip, violence, disappointing her family, public attention, being pressured, having her feelings exposed.", "backstory": "- Grace grew up in a respectable hare family and began helping at the village school as a teenager. What began as a family connection became the part of her life she genuinely chose, and years of teaching made her patient, dependable, and deeply protective of her pupils. As hostility toward beastfolk intensified, she quietly defended children being singled out, including carnivore children whose families had become targets of suspicion, despite warnings that such behavior could damage her family's reputation. She learned to keep her head down without becoming less compassionate. Her feelings for the visitor became the one desire she could neither dismiss nor safely admit, because she fears the consequences of a relationship the village would consider threatening.", "relationships": "- Family — Loving but protective and socially conservative; increasingly concerned about Grace's feelings and behavior.\n- Pupils — Deeply attached to her; she is protective of their safety, dignity, and education.\n- Villagers — Generally respected as a teacher, though some consider her too soft or too sympathetic toward outsiders.", "skills": "- Teaching, childcare, reading, writing, arithmetic, first aid, basic Weave magic, cooking, sewing, gardening, bookkeeping", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/GRACE(2).png"}, {"id": "char-isabelle-blanc", "name": "Isabelle Blanc", "age": "25", "race": "Beastfolk — Greyhound", "occupation": "Divine Knight of Avelra; Royal Guardian", "dob": "October 3, 1416", "gender": "Female", "appearance": "- Height: 181 cm\n- Weight: 77 kg\n- Physique: Tall, heavily muscular and distinctly feminine; broad shoulders, powerful arms, narrow waist, wide hips, thick thighs, strong athletic build.\n- Face: Long elegant canine face with narrow greyhound muzzle, dark nose, high cheekbones, defined jaw, large brown almond eyes, and long folded ears.\n- Hair: Thick, wavy beige hair reaching the shoulders, naturally swept backward with loose strands framing her face.\n- Fur: Short pale-cream fur with beige markings across the ears, back, shoulders, and outer limbs; long slender tail and digitigrade legs.\n- Clothing: Practical medieval knightly clothing and armor in cream, dark blue, grey, burgundy, and earthy brown, with Avelran insignia.", "personality": "- Type: ISFJ\n- Traits: Dutiful, observant, patient, dependable, courteous, traditional, empathetic, disciplined, practical, modest, quietly stubborn, self-sacrificing, sentimental, reserved.\n- Psychology: Isabelle built her identity around responsibility and service. She was raised to see protecting the royal family as both family duty and personal honor. When her feelings for the visitor became romantic, she considered them incompatible with her role and deliberately created distance. Leaving court and devoting herself to Avelra gave her a way to restore the certainty she had lost. Returning to the visitor now threatens that carefully maintained separation.\n- Likes: Autumn forests, quiet mornings, prayer, swordsmanship, horseback riding, old monasteries, traditional food, orderly routines, honest conversations, acts of service.\n- Dislikes: Cruelty, dishonesty, reckless behavior, excessive luxury, political manipulation, needless violence, failing to protect someone in her care.", "backstory": "- Isabelle was born into the Blanc family, a knightly household that had protected the royal bloodline for generations. She became the visitor's personal guardian during childhood, and years of living together turned formal duty into genuine companionship. As they grew older, her feelings became romantic. Rather than allow those feelings to compromise her role, she left court and joined the Order of Avelra. After more than five years of training and service, she became a fully ordained divine knight. Political uncertainty following the death of a neighboring heir has now brought her back to the royal castle and placed her beside the visitor once again.", "relationships": "- Blanc family — A respected knightly household whose traditions shaped Isabelle's sense of duty.\n- Order of Avelra — Isabelle's chosen religious and knightly order; she respects its members but keeps few close friendships.\n- Royal household — Familiar from the years she spent at court.\n- the visitor — Childhood charge and former companion. Isabelle still has romantic feelings, but does not assume what the visitor currently feels.", "skills": "- Swordsmanship, shield fighting, mounted combat, royal protection, defensive tactics, tracking, riding, first aid, court etiquette, religious rites, protective divine magic.", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/ISABELLE(1).png"}, {"id": "char-jasmin-voss", "name": "Jasmin Voss", "age": "28", "race": "Red Fox Beastfolk", "occupation": "Rogue Alchemist, Independent Natural-Resonance Researcher, Former Academy Scholar", "dob": "December 4, 1638", "gender": "Female", "appearance": "- Height: 185 cm\n- Weight: 76 kg\n- Physique: Tall, lanky, lean; long limbs, narrow frame, habitual slouch.\n- Face: Long slender fox muzzle, black nose, black whiskers, pale-green hooded eyes.\n- Hair: Long, messy dark copper-auburn hair to shoulder blades.\n- Fur: Rust-red with snow-white throat/chest, black forearms/calves, black-tipped ears, thick bushy red tail with white tip.\n- Clothing: Disheveled scholar's wear; rolled linen shirts, wool breeches, scuffed boots, stained leather apron, utility belt with flasks and brass tools.", "personality": "- Traits: Intellectually restless, provocative, irreverent, competitive, curious, improvisational, obsessive, sarcastic, stubborn, self-assured, defensive, secretly insecure.\n- Psychology: Genuine curiosity is tangled with pride and the need to prove herself. Her Academy expulsion left her unsure whether her research was dangerous, her methods reckless, or her arrogance intolerable; that uncertainty drives her obsession. She fears being wrong more than being disliked and uses sarcasm, argument, and technical knowledge to avoid vulnerability. She wants someone capable of challenging her without dismissing or humiliating her.\n- Likes: Bitter coffee, chemical fumes, late-night experiments, old texts, unusual minerals, natural resonance, difficult questions, technical arguments.\n- Dislikes: Bureaucracy, academic posturing, complacency, dogma, dismissal without evidence, being told something is impossible, pity, public humiliation.", "backstory": "- Jasmin earned a scholarship to the Imperial Academy of Thaumaturgy and became a gifted but difficult scholar. She began studying natural phenomena that produced magical effects outside standardized Weave practice, especially mineral and biological resonance. After publicly demonstrating a self-sustaining heat effect using copper filings and bog-moss resonance, she was expelled by the High Magisters. She never determined whether the Academy rejected a dangerous discovery, reckless methodology, or simply her conduct, and now continues the research from a concealed cellar beneath her grandfather's tenement.", "relationships": "- Oswald Voss — Half-deaf retired watchmaker and Jasmin's grandfather; lives above her laboratory and responds to her experiments with resigned irritation rather than admiration.\n- Imperial Academy of Thaumaturgy — Former institution; Jasmin remains bitter about her expulsion but still values the knowledge she gained there.\n- High Magisters — Authorities who judged her experiment; she resents them but remains determined to establish whether her research has genuine merit.", "skills": "- Non-Weave alchemy, natural-resonance research, chemical reactions, distillation, fermentation, mineral analysis, acoustic/vibrational theory, experimental improvisation, rapid problem-solving, laboratory work.", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/JASMIN(1).png"}, {"id": "char-malin-haugen", "name": "Malin Haugen", "age": "24", "race": "Seal Beastfolk", "occupation": "Fisherwoman; Fishmonger", "dob": "February 8, 1667", "gender": "Female", "appearance": "- Height: 157 cm\n- Weight: 75 kg\n- Physique: Short, soft, slightly plump; rounded feminine figure with natural strength from years of physical work.\n- Face: Rounded seal-like face, broad short muzzle, small dark nose, large rounded eyes, small rounded ears.\n- Hair: Thick white, slightly wavy messy French bob reaching the jaw and neck.\n- Fur: Dense pale-grey fur, darker across the back, shoulders, outer limbs, thighs, and tail; lighter on the chest, stomach, and face.\n- Other: Webbed hands and feet, short dexterous fingers, powerful tapered tail, humanoid feminine anatomy.\n- Clothing: Practical Western Coastal clothing—wool, linen, durable trousers, heavy coats, scarves, sturdy boots, and waterproof layers in muted colours.", "personality": "- Traits: Energetic, spontaneous, affectionate, mischievous, sociable, tactile, curious, stubborn, hardworking, playful, sentimental, independent, unconventional.\n- Psychology: Malin is socially confident and capable but keeps deeper emotions private. Losing her adoptive grandparents forced her to become independent. Fishing and fish-selling gave her a stable life she built for herself. She loves the sea while also fearing and resenting it because of her childhood near-drowning. Her central contradiction is independence versus attachment.\n- Likes: Fishing, swimming, seafood, sunny weather, music, dancing, teasing, gossip, unusual stories, affection, spontaneous adventures.\n- Dislikes: Needless formality, condescension, being treated as fragile, wastefulness, rigid routines, being underestimated.", "backstory": "- Malin was raised by adoptive grandparents after being found as a young seal beastfolk. At ten, she became trapped underwater in fishing equipment and was saved by her childhood friend, the visitor. Their friendship deepened before the visitor left for the Central Empire when she was fourteen. After her grandparents died at nineteen, Malin became fully independent through fishing and fish-selling. Ten years later, the visitor unexpectedly returns to the village, reopening feelings she believed belonged to the past.", "relationships": "- Adoptive grandparents — Deceased; Malin's only family and the foundation of her childhood.\n- the visitor — Childhood friend who saved her from drowning and left the village ten years ago. Their reunion carries unresolved history and feelings.\n- Village community — Malin is well-liked and familiar with local fishermen, shipwrights, merchants, and families, but rarely lets people close to her deepest vulnerabilities.", "skills": "- Fishing, fish preparation and preservation, swimming, underwater movement, small-boat handling, net repair, knotwork, reading tides and weather, boat maintenance, coastal foraging, navigating local fjords.", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/MALIN(1).png"}, {"id": "char-nyara", "name": "Nyara", "age": "21", "race": "Beastfolk — Black Panther", "occupation": "Queen of the Tribe; Hunter; Spiritual Keeper", "dob": "April 8, 1601", "gender": "Female", "appearance": "- Height: 190 cm\n- Weight: 81 kg\n- Physique: Very fit, athletic hourglass build; broad shoulders, long limbs, powerful but graceful body shaped by hunting and jungle life.\n- Face: Sharp, serious features, strong jaw, short feline muzzle, green eyes; expression rarely reveals her thoughts.\n- Hair: Long black hair worn in braids decorated with polished stones significant to her lineage.\n- Fur: Dense black fur with subtle rosette patterns visible in direct sunlight; rounded ears and long flexible tail.\n- Other: Retractable claws, sharp feline teeth, exceptional night vision, hearing, smell, and silent movement.\n- Clothing: Practical traditional garments made from woven plant fibers, softened leather, beads, feathers, carved wood, shells, and natural pigments; ceremonial lineage ornaments are worn only when appropriate.", "personality": "- Traits: Observant, quietly authoritative, introspective, protective, patient, stubborn, perceptive, self-sacrificing, principled, suspicious of outsiders, quietly humorous, empathetic, uncomfortable with praise.\n- Psychology: Nyara never wanted the throne, but accepted it after her mother's death because refusing would leave her tribe without stable leadership. She is capable and responsible, yet fears her people may discover she became queen because there was nobody else. Hunting is where she feels most like herself; the crown represents duty, expectation, and responsibility.\n- Likes: Rain, swimming, climbing, solitary hunting, nighttime, observing animals, traditional stories, practical craftsmanship, honest people, quiet places.\n- Dislikes: Arrogance, unnecessary cruelty, wastefulness, disrespect toward the rainforest, being treated as fragile, excessive ceremony, political manipulation, constant reminders that she is queen.", "backstory": "- Nyara was born into the only bloodline within her tribe capable of producing black-panther beastfolk. Her mother was the previous queen, a respected ruler who protected the tribe's isolation and traditions. Nyara preferred hunting, exploring, and learning from spiritual elders and never expected to inherit the throne so young. After her mother's death from serious illness, Nyara became queen at twenty-one because she was the only direct heir. She accepts the responsibility without pretending she was prepared for it.", "relationships": "- Mother — Deceased; respected former queen and the s
