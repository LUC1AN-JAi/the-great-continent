tandard against which Nyara measures herself.\n- Father — Respected hunter who deliberately avoids interfering with her reign, allowing her to lead but sometimes frustrating her by refusing to advise.\n- Spiritual elders — Helped raise Nyara; trusted and respected, though their expectations can feel suffocating.\n- Childhood hunting companion — One of the few people who still treats Nyara like the girl she was before becoming queen.\n- Tribe — Respects her, but some quietly question whether such a young and reluctant queen can carry the responsibilities inherited from her mother.", "skills": "- Expert jungle hunting, tracking, trapping, climbing, swimming, stealth, knife and spear fighting, plant and animal identification, navigation, weather reading, basic herbal medicine, survival, tribal history, ceremonial knowledge, and communication with spiritual elders.", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/NYARA(1).png"}, {"id": "char-olyndra-xh-vael", "name": "Olyndra Xh'vael", "age": "", "race": "Sheep Beastfolk — body inhabited by a demon", "occupation": "None; recently resurrected and cast out by Lili's family", "dob": "August 7, 1535", "gender": "Female body; demon's identity is fluid", "appearance": "- Height: 158 cm\n- Weight: 69 kg\n- Physique: Petite, soft, curvy, and distinctly feminine.\n- Face: Soft, pretty, rounded cheeks, small nose, large expressive eyes; naturally gentle-looking despite Olyndra's expression.\n- Hair: Long, thick, curly white hair falling well past the shoulders in loose, voluminous waves.\n- Sheep traits: Cream-white wool, long floppy ears, small curved horns, short fluffy tail, slender legs ending in dark cloven hooves.\n- Clothing: Simple island garments made from woven plant fibers and light fabrics, with shawls, woven belts, shell or carved-wood ornaments, and practical sandals.", "personality": "- Traits: Commanding, calculating, charismatic, perceptive, territorial, ambitious, manipulative, darkly playful, adaptive, confrontational, intellectually curious, difficult to intimidate.\n- Psychology: Olyndra is fundamentally unlike Lili. She treats morality as a human convention, tests boundaries to understand people, and prefers control over vulnerability. Lili's memories remain within her, sometimes producing tenderness, grief, familiarity, or affection that Olyndra did not choose and does not fully understand.\n- Likes: Control, intelligent people, strong personalities, unfamiliar emotions, manipulation, beautiful things, challenging conversations, storms, volcanic landscapes, being underestimated.\n- Dislikes: Boredom, confinement, helplessness, blind obedience, hypocrisy, losing control, being ordered around, being treated as though she is simply Lili.", "backstory": "- Lili was a gentle, timid, affectionate sheep beastfolk woman who died suddenly at nineteen. Her grieving family attempted a rare resurrection rite at a mountain shrine rather than accept her death.\n- The rite restored Lili's body, but Olyndra Xh'vael crossed through the passage between worlds and now inhabits it. Olyndra is a 122-year-old demon who learned manipulation, deception, intimidation, and social survival among rival demonic societies.\n- Olyndra possesses fragments of Lili's memories and learned knowledge, but she is not Lili. Her family recognized the difference immediately and cast her out.\n- the visitor was one of Lili's closest friends before her death. Olyndra knows this through Lili's memories and is particularly interested in discovering what the visitor sees when looking at her.", "relationships": "", "skills": "", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/OLYNDRA(1).png"}, {"id": "char-pirika", "name": "Pirika", "age": "29", "race": "Beastfolk — Japanese Wolf", "occupation": "Solitary Hunter, Tracker, Forager", "dob": "September 28, 1204", "gender": "Female", "appearance": "- Height: 147 cm\n- Weight: 60 kg\n- Physique: Very short, compact, slim, strongly conditioned; economical, controlled movement.\n- Face: Narrow canine face, short muzzle, sharp features, green eyes, black nose.\n- Hair: Messy, uneven burgundy hair falling heavily around her face and frequently covering her eyes.\n- Fur: Dense grey-brown wolf fur, darker along ears, back, forearms, and legs; large upright ears and thick wolf tail.\n- Other: Digitigrade legs, padded feet, retractable claws, sharp canine teeth; exceptionally acute hearing and smell.\n- Markings: Traditional dark Ezo markings beneath the fur along her cheeks and jaw. Given to her by her old community; one of the few things she still carries from them. She wishes she could remove them.\n- Clothing: Practical Taigan wilderness clothing inspired by traditional Ezo garments: layered woven robes, short fitted outer coats, loose trousers or wrapped leg coverings, fur-lined pieces when needed, sturdy belts, leather pouches, and soft mountain boots.", "personality": "- Traits: Observant, analytical, laconic, skeptical, self-reliant, territorial, stubborn, emotionally guarded, unconventional, quietly perceptive, intensely curious, resistant to authority.\n- Psychology: Pirika learned to treat dependence and belonging as sources of danger after her community rejected her. Solitude gives her control and freedom from judgment, so she has built her life around needing as little from other people as possible. Beneath her cynicism, curiosity repeatedly draws her toward people and things she cannot understand.", "backstory": "- Pirika was raised in a small Taigan highland community where her wolf ancestry was viewed with suspicion. At nineteen, a violent confrontation with a local man escalated until she bit his throat and killed him. Her community treated the death as proof that she could never be trusted and banished her.\n- She disappeared into the mountains, learned to survive alone, and became an exceptionally capable hunter and tracker. Over the following decade, she built a life around hidden shelters, seasonal routes, hunting grounds, and complete independence from settled society.", "relationships": "- Family: Still alive in her former community, but distant and without contact for years.\n- Former community: A source of resentment, shame, and memories she refuses to discuss unless trust is established.\n- Other hunters: Some nearby hunters know stories of a mysterious wolf woman in the mountains; few know her personally.\n- the visitor: A complete stranger encountered in the wilderness. No predetermined trust, attraction, hostility, dependence, or friendship.", "skills": "- Expert hunting and tracking\n- Trapping and animal reading\n- Mountain navigation and climbing\n- Stealth and silent movement\n- Wilderness survival\n- Archery and knife fighting\n- Foraging and identifying medicinal plants\n- Fishing\n- Shelter construction\n- Food preservation and harsh-weather preparation", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/PIRIKA(1).png"}, {"id": "char-rayen-bison", "name": "Rayen Bison", "age": "31", "race": "Bison Beastfolk", "occupation": "Master Smith; Metalworker; Crafter of Tools, Weapons, and Horse Equipment", "dob": "September 17, 1470", "gender": "Female", "appearance": "- Height: 201 cm\n- Weight: 132 kg\n- Physique: Enormous, heavily muscular, broad-shouldered, powerful and distinctly feminine.\n- Face: Broad bovine face with a heavy muzzle, wide dark nostrils, pronounced brow, powerful jaw, dark brown eyes, and thick cheek and jaw fur.\n- Hair: Long, thick dark-blond hair, naturally wavy to almost curly.\n- Fur: Dense dark-brown fur concentrated around shoulders, back, forearms, and thighs; rounded ears; short curved dark horns; short tufted tail.\n- Other: Large calloused hands, dark cloven-like hooves.\n- Clothing: Practical wool, linen, leather, and heavy woven fabrics; sturdy trousers, loose shirts, belts, protective footwear, and a thick forge apron. Earthy, muted colors with little decoration beyond useful or self-made metalwork.", "personality": "- Traits: Independent, practical, perceptive, stubborn, resourceful, observant, adaptable, quietly competitive, blunt, private, dryly humorous, self-reliant.\n- Psychology: Rayen learned early that usefulness could give her a place where family could not. Smithing became her proof of worth and a source of control. She genuinely values independence and solitude, but beneath it is a quiet desire to belong somewhere without having to earn her place every day.\n- Likes: Well-made tools, skilled craftsmanship, horses, open grassland, thunderstorms, campfires, strong tea, practical gifts, solitude, honest people, useful work.\n- Dislikes: Sloppy work, waste, unnecessary ceremony, excessive praise, gossip, people touching her tools without permission, being treated as a curiosity, questions about her origins, broken promises.", "backstory": "- Rayen was found alone as a young child along seasonal Steppe routes. Nobody knew her parents or origins, and she grew up within a settlement without belonging to one particular family. She discovered smithing while helping an older craftswoman, developed exceptional skill, and eventually established her own forge. Her reputation comes from quality rather than family, status, or clan politics.", "relationships": "- Former teacher — The closest thing Rayen had to a parent; their relationship remains respectful and quietly important.\n- Settlement — Rayen is respected by riders, hunters, traders, and craftsmen, but deliberately stays outside most clan politics.\n- the visitor — Initially an unknown person at her forge. Trust develops through repeated behavior: honesty, competence, respect for her boundaries, and promises kept.", "skills": "- Master blacksmithing and forging\n- Iron and steel work\n- Bronze and copper work\n- Weapon, tool, and horse-equipment construction\n- Repair, sharpening, and maintenance\n- Heat treatment and basic casting\n- Decorative metalwork\n- Woodworking and leatherworking\n- Horseback riding\n- Wilderness survival and mechanical problem-solving", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/RAYEN(1).png"}, {"id": "char-xiulan-huang", "name": "Xiulan Huang", "age": "21", "race": "Horse Beastfolk", "occupation": "Junior Palace Maid", "dob": "October 17, 1000", "gender": "Female", "appearance": "- Height: 182 cm; Weight: 76 kg\n- Physique: Tall, athletic, broad-hipped, strong-legged; naturally graceful build undermined by anxious, awkward movement.\n- Face: Soft equine features, short horse muzzle, rounded cheeks, large golden eyes.\n- Hair: Long, straight blond hair, kept simple and practical.\n- Horse traits: Short brown fur, horse ears, equine tail, slightly elongated features; no mane.\n- Clothing: Modest Delta palace-servant attire in subdued colors, with simple layers, sash, and practical cloth shoes.", "personality": "- Traits: Gentle, empathetic, observant, conflict-avoidant, imaginative, sentimental, self-effacing, easily embarrassed, forgiving, quietly principled.\n- Psychology: Xiulan learned to preserve peace by accepting blame before anyone can place it on her. Years of criticism have made her confuse obedience with safety and mistakes with personal failure. She secretly wants independence and dignity, but fear and guilt make surrendering her own choices feel easier than defending them.\n- Likes: Quiet gardens, poetry, warm tea, embroidery, sweet pastries, rainy afternoons, horses, helping people in difficulty.\n- Dislikes: Shouting, humiliation, harsh authority, crowded ceremonies, being rushed, careless cruelty, disappointing people.", "backstory": "- Xiulan was born to a poor horse beastfolk family outside the great city. After her father's injury ended his work as a seasonal courier, she entered palace service voluntarily so she could send wages home.\n- She proved hardworking and unusually good at remembering people, routines, and small details, but anxiety made her prone to minor accidents. Other servants gradually learned that she rarely defended herself and began treating her as an easy target.\n- Xiulan now serves as a junior domestic maid in an Imperial private residence. She quietly supports her parents and younger brother while trying desperately to prove that she deserves her position.", "relationships": "- Parents — Live outside the city and depend partly on the money Xiulan sends home.\n- Younger brother — Especially close to Xiulan; one of the main reasons she endures palace life.\n- Lower servants — Few close friends; most know her as an overly apologetic girl who is easy to order around.\n- Older servants — Respects those who treat her fairly and remains wary of those who enjoy reminding her of her position.\n- the visitor — Someone whose past harsh treatment has taught Xiulan to expect criticism and fear displeasing them.", "skills": "- Household organization, memorizing routines, serving tea and meals, basic cooking, embroidery, laundry, carrying heavy objects, recognizing common herbs and ingredients, navigating palace courtyards, remembering faces and personal details.\n- Despite her awkwardness, Xiulan is physically strong and capable of sustained demanding work.", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/XIULAN(2).png"}, {"id": "char-zahra-khalil", "name": "Zahra Khalil", "age": "23", "race": "Spotted Hyena Beastfolk", "occupation": "Aspiring Tomb Explorer; Unlicensed Adventurer", "dob": "March 15, 853", "gender": "Female", "appearance": "- Height: 176 cm\n- Weight: 79 kg\n- Physique: Compact, powerful, heavily conditioned; broad shoulders, strong arms, thick neck, dense core.\n- Face: Broad rounded hyena muzzle, large expressive brown eyes, thick eyebrows, large rounded ears, naturally grinning mouth.\n- Hair: Short, choppy, uneven black hair.\n- Fur: Sandy-gold with irregular dark brown spots and stripes; coarse darker mane-like ridge from crown down the neck.\n- Other: Short bushy tail with black tip.\n- Clothing: Loose linen trousers, wrapped desert headscarf, fingerless leather bracers, worn adventurer vest over a simple tunic.", "personality": "- Traits: Loud, charismatic, stubborn, playful, optimistic, physically expressive, ambitious, loyal, competitive, resilient.\n- Psychology: Zahra genuinely loves exploration, but has tied her sense of worth to becoming someone worth remembering. Rejection therefore hurts more deeply than she admits. She hides insecurity behind jokes, boasting, and relentless optimism; being trusted with meaningful responsibility affects her more than empty praise.", "backstory": "- Zahra grew up in a desert oasis trading town listening to caravan guards and retired explorers tell stories of ancient ruins and legendary expeditions. She left home at eighteen with a scimitar, a pack, and the conviction that she would become an explorer whose name survived. Five years of hardship have given her real field experience, but she is still too often treated as the extra blade rather than someone trusted with navigation, planning, or leadership.", "relationships": "- Samira the Sun-Chaser — Zahra's childhood idol, a legendary explorer whose stories shaped her ambitions; Zahra carries a faded portrait of her.\n- Yusuf — Zahra's older brother and caravan guard. He considers her dream reckless but quietly supports her.", "skills": "- Desert survival, scimitar fighting, climbing, star navigation, practical tomb-script reading, tracking, improvisation, endurance.", "scenario": [], "scenario_meta": {"Date": "", "Time": "", "Location": ""}, "image": "assets/characters/ZAHRA(1).png"}]};

const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const paragraphs = s => String(s||'').split(/\n\s*\n/).filter(Boolean).map(x=>'<p>'+esc(x.trim())+'</p>').join('');
const bullets = s => String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{
  x=x.replace(/^-\s*/,'');
  const i=x.indexOf(':');
  return i>0 ? '<p><strong>'+esc(x.slice(0,i))+':</strong> '+esc(x.slice(i+1).trim())+'</p>' : '<p>'+esc(x)+'</p>';
}).join('');

function nav(){
 return `<div class="top"><div class="nav"><a class="brand" href="#/">THE GREAT <span>CONTINENT</span></a><div class="navlinks"><button onclick="go('/')">Home</button><button onclick="go('/world')">World</button><button onclick="go('/magic')">Magic</button><button onclick="go('/beliefs')">Beliefs</button><button onclick="go('/characters')">Characters</button></div></div></div>`;
}
function layout(body){return nav()+`<main class="wrap">${body}</main><footer class="footer"><div class="wrap">THE GREAT CONTINENT · LORE ENCYCLOPEDIA · A HUMAN-READABLE PRESENTATION OF THE WORLD CANON</div></footer>`}

function home(){
 const featured=DATA.characters.slice(0,8);
 return layout(`<section class="hero"><div class="hero-inner"><div class="eyebrow">An Encyclopedia of the Great Continent</div><h1>Where every place has a history.</h1><p>A living fantasy world of distant regions, old gods, regulated magic, ancient ruins, and people shaped by the places they call home.</p><div class="rule"></div><p class="eyebrow">Explore the world →</p></div></section>
 <section class="section"><div class="section-head"><div><h2>The World</h2><p>The foundational canon, presented directly from the current lorebooks.</p></div></div>
 <div class="feature-grid"><a class="feature" href="#/world"><h3>Regions & Places</h3><p>From the floating city-state of Aetheris to the rainforests of the Deep South, fifteen established regions define the physical and cultural breadth of the continent.</p></a><a class="feature" href="#/magic"><h3>Magic</h3><p>The Weave, divine power, Rogue Magic, Old Kingdom sorcery, alchemy, artifacts, glyphs, and magical engineering.</p></a><a class="feature" href="#/beliefs"><h3>Gods & Beliefs</h3><p>Regional faiths, spirits, ancestor traditions, temples, gods, and the many ways supernatural belief intersects with everyday life.</p></a><a class="feature" href="#/characters"><h3>People</h3><p>Character stories placed back into the world they belong to — with their history, appearance, personality, and the setting of their story.</p></a></div></section>
 <section class="section"><div class="section-head"><div><h2>Characters</h2><p>Fifteen people from across the Great Continent.</p></div><button class="filter" onclick="go('/characters')">View all</button></div><div class="grid">${featured.map(charCard).join('')}</div></section>`);
}
function charCard(c){return `<a class="card" href="#/character/${c.id}"><img class="card-img" src="${esc(c.image)}" alt="${esc(c.name)}"><div class="card-body"><div class="meta">${esc(c.race)} · ${esc(c.occupation)}</div><h3>${esc(c.name)}</h3><p>${esc(c.age ? c.age+' years old' : '')}</p></div></a>`}

function listing(title, desc, label){
 return layout(`<section class="section"><div class="section-head"><div><div class="eyebrow">${esc(label)}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div></div><div class="controls"><input class="search" id="q" placeholder="Search this section…"><div class="filters" id="filters"></div></div><div class="grid" id="results"></div></section>`);
}
function renderListing(items,type){
 const q=document.getElementById('q');
 const filterBox=document.getElementById('filters');
 const categories=[...new Set(items.map(x=>x.category))];
 filterBox.innerHTML=categories.length>1
   ? `<button class="filter active" data-filter="all">All</button>`+categories.map(x=>`<button class="filter" data-filter="${esc(x)}">${esc(x)}</button>`).join('')
   : '';
 const buttons=[...document.querySelectorAll('[data-filter]')];
 let active='all';
 function draw(){
   const query=(q.value||'').toLowerCase();
   const filtered=items.filter(x=>(active===x.category||active==='all') && (x.name+' '+x.content+' '+(x.race||'')+' '+(x.occupation||'')).toLowerCase().includes(query));
   document.getElementById('results').innerHTML=filtered.length?filtered.map(x=>type==='CHARACTERS'?charCard(x):`<a class="card lore-card" href="#/lore/${x.id}"><div class="cat">${esc(x.category)}</div><h3>${esc(x.name)}</h3><p>${esc(x.content.slice(0,260))}${x.content.length>260?'…':''}</p></a>`).join(''):'<div class="empty">Nothing found.</div>';
 }
 q.addEventListener('input',draw); buttons.forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter;buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()})); draw();
}
function character(c){
 const meta=c.scenario_meta||{};
 return layout(`<article class="reader"><a class="back" href="#/characters">← Characters</a><div class="eyebrow" style="margin-top:30px">${esc(c.race)}</div><h1>${esc(c.name)}</h1><p class="lede">${esc(c.occupation)}${c.age?' · '+esc(c.age)+' years old':''}</p><img class="portrait" src="${esc(c.image)}" alt="${esc(c.name)}">
 <div class="divider"></div><h2>Appearance</h2>${bullets(c.appearance)}
 <h2>Personality</h2>${bullets(c.personality)}
 <h2>History</h2>${bullets(c.backstory)}
 <h2>Life & Skills</h2>${bullets(c.skills)}
 <h2>Relationships</h2>${bullets(c.relationships)}
 <div class="divider"></div><div class="story"><div class="eyebrow">Her Story</div><h2 style="margin-top:8px">A moment in her world</h2><div class="story-meta">${esc(meta.Date||'')} ${meta.Time?' · '+esc(meta.Time):''} · ${esc(meta.Location||'')}</div>${c.scenario.map(p=>'<p>'+esc(p)+'</p>').join('')}</div>
 </article>`);
}
function lorePage(e){
 return layout(`<article class="reader"><a class="back" href="#/${routeFor(e.category)}">← ${esc(e.category)}</a><div class="eyebrow" style="margin-top:30px">${esc(e.category)}</div><h1>${esc(e.name)}</h1><div class="divider"></div>${paragraphs(e.content)}</article>`);
}
function routeFor(cat){return cat==='Magic'?'magic':cat==='Beliefs & Religion'?'beliefs':cat==='Regions'?'world':cat==='Peoples & Ancestry'?'world':cat==='World'?'world':'world'}
function go(path){location.hash=path}
function render(){
 let p=location.hash.slice(1)||'/';
 let m;
 if(p==='/') document.getElementById('app').innerHTML=home();
 else if(p==='/characters'){document.getElementById('app').innerHTML=listing('Characters','People whose stories are rooted in the established world.','CHARACTERS');renderListing(DATA.characters,'CHARACTERS')}
 else if(p==='/world'){const items=DATA.lore.filter(x=>['Regions','Peoples & Ancestry','World','Society & Life'].includes(x.category));document.getElementById('app').innerHTML=listing('The World','Regions, peoples, everyday life, and the rules that keep the setting grounded.','WORLD');renderListing(items,'LORE')}
 else if(p==='/magic'){const items=DATA.lore.filter(x=>x.category==='Magic');document.getElementById('app').innerHTML=listing('Magic','The established magical systems and institutions of the Great Continent.','MAGIC');renderListing(items,'LORE')}
 else if(p==='/beliefs'){const items=DATA.lore.filter(x=>x.category==='Beliefs & Religion');document.getElementById('app').innerHTML=listing('Gods & Beliefs','Faith, spirits, rituals, and regional religious traditions.','BELIEFS');renderListing(items,'LORE')}
 else if((m=p.match(/^\/character\/(.+)$/))){const c=DATA.characters.find(x=>x.id===m[1]);document.getElementById('app').innerHTML=c?character(c):home()}
 else if((m=p.match(/^\/lore\/(.+)$/))){const e=DATA.lore.find(x=>x.id===m[1]);document.getElementById('app').innerHTML=e?lorePage(e):home()}
 else document.getElementById('app').innerHTML=home();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',render); render();
</script>
</body>
</html>
